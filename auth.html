<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion | API-GKIMMO</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#faf8f2;color:#29251f}
header{background:#38231f;color:white;padding:18px 7%;display:flex;justify-content:space-between}
header a{color:white;text-decoration:none}
main{max-width:520px;margin:40px auto;padding:18px}
.panel{background:white;border:1px solid #eee5d9;border-radius:12px;padding:28px}
h1{color:#432c23}
.intro,.small{color:#766d65}
.tabs{display:flex;gap:8px;margin:20px 0}
.tab{flex:1;padding:12px;border:1px solid #d9cbbb;background:#faf8f2;cursor:pointer}
.tab.active{background:#38231f;color:white}
label{display:block;margin:14px 0 6px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #d7cec2;border-radius:6px}
.submit{width:100%;padding:13px;margin-top:20px;background:#d6ad60;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
.submit:disabled{opacity:.6}
.link{display:block;text-align:center;margin-top:15px;color:#72512c;cursor:pointer}
.message{display:none;margin-top:16px;padding:12px;border-radius:6px}
.message.info{display:block;background:#f3ead8}
.message.error{display:block;background:#fce8e6;color:#8b2118}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<strong>API-GKIMMO</strong>
<a href="index.html">← Accueil</a>
</header>
<main>
<div class="panel">
<h1>Votre espace de formation</h1>
<p class="intro">Connectez-vous à l'Académie Professionnelle de l'Immobilier GKIMMO.</p>
<div class="tabs">
<button class="tab active" id="loginTab" type="button">Connexion</button>
<button class="tab" id="signupTab" type="button">Créer un compte</button>
</div>
<form id="authForm">
<div id="nameField" hidden>
<label for="fullName">Nom et prénom</label>
<input id="fullName" type="text" autocomplete="name">
</div>
<label for="email">Adresse e-mail</label>
<input id="email" type="email" autocomplete="email" required>
<label for="password">Mot de passe</label>
<input id="password" type="password" minlength="8" required>
<button class="submit" id="submitBtn" type="submit">Se connecter</button>
</form>
<a class="link" id="forgotLink">Mot de passe oublié ?</a>
<div class="message" id="message" role="status"></div>
<p class="small">Académie Professionnelle de l'Immobilier GKIMMO.</p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL="https://uhrmfqsrxnmrdfiwcazm.supabase.co";
const KEY="sb_publishable_KumzgRkeVpfJZOgJ5vOfgw_cfcN7A7A";
const client=window.supabase.createClient(URL,KEY);
const loginTab=document.getElementById("loginTab");
const signupTab=document.getElementById("signupTab");
const nameField=document.getElementById("nameField");
const fullName=document.getElementById("fullName");
const form=document.getElementById("authForm");
const submitBtn=document.getElementById("submitBtn");
const message=document.getElementById("message");
const forgotLink=document.getElementById("forgotLink");
let mode="login";
function showMessage(text,type="info"){
message.textContent=text;
message.className="message "+type;
}
function setMode(next){
mode=next;
const signup=mode==="signup";
loginTab.classList.toggle("active",!signup);
signupTab.classList.toggle("active",signup);
nameField.hidden=!signup;
fullName.required=signup;
submitBtn.textContent=signup?"Créer mon compte":"Se connecter";
forgotLink.hidden=signup;
message.className="message";
}
loginTab.onclick=()=>setMode("login");
signupTab.onclick=()=>setMode("signup");
async function redirectByRole(){
const {data:{session},error:sessionError}=await client.auth.getSession();
if(sessionError||!session)return;
const {data:profile,error}=await client.from("profiles").select("role").eq("id",session.user.id).single();
if(error||!profile)return;
if(profile.role==="administrateur")window.location.replace("admin.html");
else if(profile.role==="formateur")window.location.replace("formateur.html");
else window.location.replace("dashboard.html");
}
form.addEventListener("submit",async(event)=>{
event.preventDefault();
submitBtn.disabled=true;
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
try{
if(mode==="signup"){
const name=fullName.value.trim();
if(!name)throw new Error("Veuillez saisir votre nom complet.");
const {error}=await client.auth.signUp({email,password,options:{data:{full_name:name}}});
if(error)throw error;
showMessage("Compte créé. Consultez votre e-mail pour confirmer votre inscription avant de vous connecter.");
}else{
const {error}=await client.auth.signInWithPassword({email,password});
if(error)throw error;
showMessage("Connexion réussie. Ouverture de votre espace...");
await redirectByRole();
}
}catch(error){showMessage(error.message||"Une erreur est survenue.","error");}
finally{submitBtn.disabled=false;}
});
forgotLink.onclick=async()=>{
const email=document.getElementById("email").value.trim();
if(!email){showMessage("Saisissez votre adresse e-mail.","error");return;}
const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/auth.html"});
if(error)showMessage(error.message,"error");
else showMessage("Consultez votre boîte e-mail pour réinitialiser votre mot de passe.");
};
redirectByRole();
</script>
</body>
</html>
