
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Académie GKIMMO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102c24, #17634b);
    }
    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.2);
    }
    .logo {
      text-align: center;
      color: #17634b;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin: 10px 0;
      color: #183b30;
    }
    .subtitle {
      text-align: center;
      color: #68756f;
      font-size: 14px;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 15px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5ddd8;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus {
      outline: 2px solid #23845e;
      border-color: transparent;
    }
    button {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 18px;
      border-radius: 8px;
      background: #17634b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .links {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }
    .links a {
      color: #17634b;
      text-decoration: none;
      cursor: pointer;
    }
    .message {
      display: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .error {
      display: block;
      background: #fff0f0;
      color: #a32222;
    }
    .success {
      display: block;
      background: #eaf8ef;
      color: #17613a;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">GKIMMO</div>
  <h1 id="pageTitle">Bienvenue à l'Académie</h1>
  <p class="subtitle">Académie Professionnelle de l'Immobilier</p>

  <form id="authForm">
    <div id="nameField" class="hidden">
      <label for="fullName">Nom complet</label>
      <input type="text" id="fullName" autocomplete="name">
    </div>

    <label for="email">Adresse e-mail</label>
    <input type="email" id="email" required autocomplete="email">

    <div id="passwordField">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required
             autocomplete="current-password">
    </div>

    <button type="submit" id="submitBtn">Se connecter</button>
  </form>

  <div id="message" class="message"></div>

  <div class="links" id="loginLinks">
    <p><a id="forgotLink">Mot de passe oublié ?</a></p>
    <p>Pas encore de compte ?
      <a id="signupLink">Créer un compte</a>
    </p>
  </div>

  <div class="links hidden" id="signupLinks">
    <p>Vous avez déjà un compte ?
      <a id="loginLink">Se connecter</a>
    </p>
  </div>

  <div class="links hidden" id="resetLinks">
    <p><a id="backLink">Retour à la connexion</a></p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://uhrmfqsrxnmrdfiwcazm.supabase.co";
const KEY = "sb_publishable_KumzgRkeVpfJZOgJ5vOfgw_cfcN7A7A";

let client = null;
let mode = "login";

const form = document.getElementById("authForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message " + type;
}

function clearMessage() {
  message.textContent = "";
  message.className = "message";
}

function setMode(newMode) {
  mode = newMode;
  clearMessage();

  document.getElementById("nameField").classList.toggle(
    "hidden", mode !== "signup"
  );
  document.getElementById("passwordField").classList.toggle(
    "hidden", mode === "reset"
  );
  document.getElementById("loginLinks").classList.toggle(
    "hidden", mode !== "login"
  );
  document.getElementById("signupLinks").classList.toggle(
    "hidden", mode !== "signup"
  );
  document.getElementById("resetLinks").classList.toggle(
    "hidden", mode !== "reset"
  );

  document.getElementById("password").required = mode !== "reset";

  if (mode === "login") {
    document.getElementById("pageTitle").textContent =
      "Bienvenue à l'Académie";
    submitBtn.textContent = "Se connecter";
  } else if (mode === "signup") {
    document.getElementById("pageTitle").textContent =
      "Créer un compte apprenant";
    submitBtn.textContent = "Créer mon compte";
  } else {
    document.getElementById("pageTitle").textContent =
      "Réinitialiser le mot de passe";
    submitBtn.textContent = "Envoyer le lien";
  }
}

document.getElementById("signupLink").onclick = () => setMode("signup");
document.getElementById("loginLink").onclick = () => setMode("login");
document.getElementById("forgotLink").onclick = () => setMode("reset");
document.getElementById("backLink").onclick = () => setMode("login");

function loadSupabase(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error("Chargement impossible"));
    document.head.appendChild(script);
  });
}

async function initializeSupabase() {
  try {
    try {
      await loadSupabase(
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      );
    } catch (firstError) {
      await loadSupabase(
        "https://unpkg.com/@supabase/supabase-js@2"
      );
    }

    if (!window.supabase || !window.supabase.createClient) {
      throw new Error("La bibliothèque Supabase est introuvable.");
    }

    client = window.supabase.createClient(SUPABASE_URL, KEY);
    return true;
  } catch (error) {
    showMessage(
      "Service de connexion indisponible. Vérifiez Internet puis actualisez la page. " +
      error.message
    );
    submitBtn.disabled = true;
    return false;
  }
}

async function redirectUser(user) {
  showMessage("Vérification de votre compte...", "success");

  const { data, error } = await client
    .from("profiles")
    .select("full_name, role")
    .eq("id", user.id)
    .maybeSingle();

  if (error) {
    showMessage(
      "Connexion réussie, mais impossible de vérifier votre profil : " +
      error.message
    );
    return;
  }

  if (!data) {
    showMessage(
      "Votre compte est connecté, mais votre profil n'existe pas encore. " +
      "Veuillez contacter l'administration GKIMMO."
    );
    return;
  }

  if (data.role === "administrateur") {
    window.location.href = "admin.html";
  } else if (data.role === "formateur") {
    window.location.href = "formateur.html";
  } else {
    window.location.href = "dashboard.html";
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearMessage();

  if (!client) {
    showMessage("Le service de connexion n'est pas encore prêt.");
    return;
  }

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const fullName = document.getElementById("fullName").value.trim();

  submitBtn.disabled = true;
  submitBtn.textContent = "Veuillez patienter...";

  try {
    if (mode === "login") {
      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      await redirectUser(data.user);

    } else if (mode === "signup") {
      if (!fullName) {
        throw new Error("Veuillez saisir votre nom complet.");
      }

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });

      if (error) throw error;

      if (data.session && data.user) {
        showMessage(
          "Compte créé. Vérification de votre profil...",
          "success"
        );
        await redirectUser(data.user);
      } else {
        showMessage(
          "Votre demande de création de compte a été envoyée. " +
          "Consultez votre boîte e-mail pour confirmer votre adresse.",
          "success"
        );
      }

    } else if (mode === "reset") {
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/auth.html"
      });

      if (error) throw error;

      showMessage(
        "Si cette adresse correspond à un compte, un lien de réinitialisation sera envoyé.",
        "success"
      );
    }

  } catch (error) {
    showMessage(error.message || "Une erreur est survenue.");
  } finally {
    submitBtn.disabled = false;

    if (mode === "login") submitBtn.textContent = "Se connecter";
    else if (mode === "signup") submitBtn.textContent = "Créer mon compte";
    else submitBtn.textContent = "Envoyer le lien";
  }
});

initializeSupabase();
</script>

</body>
</html>
